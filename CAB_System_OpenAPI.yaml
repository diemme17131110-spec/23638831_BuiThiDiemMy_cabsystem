
openapi: 3.0.0
info:
  title: CAB System API
  version: 1.0.0
  description: |
    OpenAPI Specification cho CAB System (MVP 7 tuần).

    Chức năng chính:
      - Quản lý tài khoản (Đăng ký, Đăng nhập)
      - Đặt xe
      - Tìm và phân công tài xế
      - Quản lý trạng thái chuyến đi
      - Thanh toán
      - Đánh giá tài xế

servers:
  - url: http://localhost:8080/api/v1
    description: Local Server

tags:
  - name: Authentication
  - name: Booking
  - name: Driver
  - name: Payment
  - name: Rating

paths:
  /auth/register:
    post:
      summary: Đăng ký tài khoản
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        "201":
          description: Đăng ký thành công
        "400":
          description: Dữ liệu không hợp lệ

  /auth/login:
    post:
      summary: Đăng nhập
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        "401":
          description: Sai thông tin đăng nhập

  /bookings:
    post:
      summary: Tạo yêu cầu đặt xe
      tags: [Booking]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingRequest'
      responses:
        "201":
          description: Tạo yêu cầu thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'

    get:
      summary: Xem lịch sử chuyến đi
      tags: [Booking]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Danh sách chuyến đi
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'

  /bookings/{tripId}:
    get:
      summary: Theo dõi trạng thái chuyến đi
      tags: [Booking]
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Thông tin chuyến đi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        "404":
          description: Không tìm thấy chuyến đi

  /drivers/trips/{tripId}/accept:
    put:
      summary: Tài xế nhận chuyến
      tags: [Driver]
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Nhận chuyến thành công

  /drivers/trips/{tripId}/status:
    put:
      summary: Cập nhật trạng thái chuyến
      tags: [Driver]
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
      responses:
        "200":
          description: Cập nhật thành công

  /payments/{tripId}:
    post:
      summary: Thanh toán chuyến đi
      tags: [Payment]
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        "200":
          description: Thanh toán thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /ratings/{tripId}:
    post:
      summary: Đánh giá tài xế
      tags: [Rating]
      security:
        - bearerAuth: []
      parameters:
        - name: tripId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        "201":
          description: Đánh giá thành công

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required: [fullName, email, password, role]
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        role:
          type: string
          enum: [customer, driver]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        role:
          type: string

    BookingRequest:
      type: object
      required: [pickupLocation, destination, vehicleType]
      properties:
        pickupLocation:
          type: string
        destination:
          type: string
        vehicleType:
          type: string
          enum: [bike, car]

    Trip:
      type: object
      properties:
        tripId:
          type: integer
        customerId:
          type: integer
        driverId:
          type: integer
        pickupLocation:
          type: string
        destination:
          type: string
        vehicleType:
          type: string
        fare:
          type: number
          format: float
        status:
          type: string
          enum:
            - searching
            - assigned
            - arriving
            - arrived
            - picked_up
            - in_progress
            - completed
            - cancelled

    StatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum:
            - arriving
            - arrived
            - picked_up
            - in_progress
            - completed

    PaymentRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [cash, electronic]

    Payment:
      type: object
      properties:
        paymentId:
          type: integer
        tripId:
          type: integer
        method:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: [success, failed]

    RatingRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
