      requestData: '{"tripId":"<tripId>","type":"PAYMENT_ISSUE"}'
      expectedResult: 400 Bad Request; field description bắt buộc
    - id: TC-OPS-018
      type: businessRule
      priority: High
      scenario: Ghi nhận sự cố với tripId không tồn tại
      preconditions: Không có
      requestData: '{"tripId":"00000000-0000-0000-0000-000000000000","type":"OTHER","description":"test"}'
      expectedResult: 404 Not Found; tripId không tồn tại
  - method: PATCH
    path: /operations/incidents/{incidentId}
    fr: FR10.5
    description: Cập nhật xử lý sự cố
    allowedRole: Operator
    testCases:
    - id: TC-OPS-019
      type: positive
      priority: High
      scenario: Cập nhật sự cố sang RESOLVED kèm hướng xử lý
      preconditions: Incident đang ở trạng thái IN_PROGRESS
      requestData: '{"status":"RESOLVED","resolution":"Đã liên hệ tài xế và cập nhật lại trạng thái chuyến"}'
      expectedResult: 200 OK; Incident.status=RESOLVED, handledBy=operatorId
    - id: TC-OPS-020
      type: negative
      priority: Medium
      scenario: Cập nhật với status không hợp lệ
      preconditions: Đã đăng nhập OPERATOR
      requestData: '{"status":"DONE"}'
      expectedResult: 400 Bad Request; status không thuộc enum
    - id: TC-OPS-021
      type: businessRule
      priority: High
      scenario: incidentId không tồn tại
      preconditions: Không có
      requestData: '{"status":"RESOLVED"}'
      expectedResult: 404 Not Found
  totalTestCases: 21
- code: REPT
  file: fr11-reports.yaml
  name: 11. Reports (FR11)
  description: Báo cáo chuyến đi, doanh thu, hiệu quả tài xế
  endpoints:
  - method: GET
    path: /reports/trips
    fr: FR11.1
    description: Báo cáo chuyến đi
    allowedRole: Operator, Admin, Ban giám đốc
    testCases:
    - id: TC-REPT-001
      type: positive
      priority: High
      scenario: Xem báo cáo chuyến đi trong tháng 9/2026
      preconditions: Có dữ liệu chuyến đi trong khoảng thời gian
      requestData: from=2026-09-01T00:00:00Z&to=2026-09-30T23:59:59Z
      expectedResult: 200 OK; trả về totalTrips, completionRate, cancellationRate
    - id: TC-REPT-002
      type: negative
      priority: Medium
      scenario: Thiếu tham số from/to bắt buộc
      preconditions: Đã đăng nhập OPERATOR
      requestData: Không truyền from, to
      expectedResult: 200 OK hoặc 400 tùy quy ước; nếu bắt buộc thì trả 400 Bad Request thiếu tham số
    - id: TC-REPT-003
      type: businessRule
      priority: High
      scenario: Khoảng thời gian không có dữ liệu chuyến đi
      preconditions: Không có Trip nào trong khoảng lọc
      requestData: from=2020-01-01T00:00:00Z&to=2020-01-31T23:59:59Z
      expectedResult: 200 OK; totalTrips=0, completionRate=0
  - method: GET
    path: /reports/revenue
    fr: FR11.2
    description: Báo cáo doanh thu
    allowedRole: Operator, Admin, Ban giám đốc
    testCases:
    - id: TC-REPT-004
      type: positive
      priority: High
      scenario: Xem doanh thu theo phương thức thanh toán trong kỳ
      preconditions: Có giao dịch CASH và E_WALLET thành công trong kỳ
      requestData: from=2026-09-01T00:00:00Z&to=2026-09-30T23:59:59Z
      expectedResult: 200 OK; totalRevenue và byPaymentMethod khớp tổng các giao dịch SUCCESS
    - id: TC-REPT-005
      type: negative
      priority: Medium
      scenario: Chỉ có giao dịch tiền mặt trong kỳ
      preconditions: Không có giao dịch E_WALLET nào
      requestData: from=2026-09-01T00:00:00Z&to=2026-09-30T23:59:59Z
      expectedResult: 200 OK; byPaymentMethod chỉ liệt kê CASH
    - id: TC-REPT-006
      type: businessRule
      priority: High
      scenario: Nhân viên vận hành không có quyền báo cáo doanh thu
      preconditions: Vai trò OPERATOR không được cấp quyền revenue.read
      requestData: from=2026-09-01T00:00:00Z&to=2026-09-30T23:59:59Z
      expectedResult: 403 Forbidden (BR-02, tùy cấu hình phân quyền)
  - method: GET
    path: /reports/drivers
    fr: FR11.3
    description: Báo cáo hiệu quả tài xế
    allowedRole: Operator, Admin
    testCases:
    - id: TC-REPT-007
      type: positive
      priority: High
      scenario: Xem báo cáo hiệu quả tài xế có phân trang
      preconditions: Có dữ liệu completedTrips, rejectedOffers cho nhiều tài xế
      requestData: from=2026-09-01T00:00:00Z&to=2026-09-30T23:59:59Z&page=1&size=20
      expectedResult: 200 OK; items chứa completedTrips, rejectedOffers, averageRating từng tài xế
    - id: TC-REPT-008
      type: negative
      priority: Medium
      scenario: Không có tài xế nào hoạt động trong kỳ báo cáo
      preconditions: Không có Trip nào trong khoảng lọc
      requestData: from=2020-01-01T00:00:00Z&to=2020-01-31T23:59:59Z
      expectedResult: 200 OK; items=[]
    - id: TC-REPT-009
      type: businessRule
      priority: High
      scenario: Khoảng thời gian from/to không hợp lệ (from > to)
      preconditions: Đã đăng nhập OPERATOR
      requestData: from=2026-09-30T00:00:00Z&to=2026-09-01T00:00:00Z
      expectedResult: 400 Bad Request; khoảng thời gian không hợp lệ
  totalTestCases: 9
- code: SEC
  file: fr12-security.yaml
  name: 12. Security (FR12)
  description: Phân quyền, vai trò, audit log (BR-02, BR-19)
  endpoints:
  - method: GET
    path: /roles
    fr: FR12.1
    description: Danh sách vai trò và quyền
    allowedRole: Admin
    testCases:
    - id: TC-SEC-001
      type: positive
      priority: High
      scenario: Admin xem danh sách vai trò hệ thống
      preconditions: Hệ thống có các Role CUSTOMER, DRIVER, OPERATOR, ADMIN
      requestData: Không có tham số
      expectedResult: 200 OK; trả về mảng Role kèm permissions
    - id: TC-SEC-002
      type: negative
      priority: Medium
      scenario: Operator (không phải Admin) cố xem danh sách vai trò
      preconditions: Đăng nhập với role OPERATOR
      requestData: Không có tham số
      expectedResult: 403 Forbidden (BR-02, chỉ Admin quản lý vai trò)
    - id: TC-SEC-003
      type: businessRule
      priority: High
      scenario: Gọi endpoint khi chưa đăng nhập
      preconditions: Không gửi Authorization header
      requestData: Không có Authorization header
      expectedResult: 401 Unauthorized
  - method: PUT
    path: /users/{userId}/roles
    fr: FR12.2
    description: Gán vai trò cho người dùng
    allowedRole: Admin
    testCases:
    - id: TC-SEC-004
      type: positive
      priority: High
      scenario: Admin gán vai trò OPERATOR cho nhân viên mới
      preconditions: userId là tài khoản nhân viên hợp lệ
      requestData: '{"roleCodes":["OPERATOR"]}'
      expectedResult: 200 OK; User.role cập nhật, thao tác được ghi vào Audit Log (BR-19)
    - id: TC-SEC-005
      type: negative
      priority: Medium
      scenario: Gán vai trò không tồn tại trong hệ thống
      preconditions: Đã đăng nhập ADMIN
      requestData: '{"roleCodes":["SUPERHERO"]}'
      expectedResult: 400 Bad Request; roleCodes chứa giá trị không hợp lệ
    - id: TC-SEC-006
      type: businessRule
      priority: High
      scenario: Operator (không phải Admin) cố gán vai trò
      preconditions: Đăng nhập với role OPERATOR
      requestData: '{"roleCodes":["ADMIN"]}'
      expectedResult: 403 Forbidden (BR-02, BR-10)
  - method: GET
    path: /audit-logs
    fr: FR12.3
    description: Tra cứu Audit Log
    allowedRole: Admin
    testCases:
    - id: TC-SEC-007
      type: positive
      priority: High
      scenario: Tra cứu log theo actorId và khoảng thời gian
      preconditions: Có log thao tác ROLE_ASSIGNED trong khoảng thời gian
      requestData: actorId=<adminId>&from=2026-09-01T00:00:00Z&to=2026-09-30T23:59:59Z
      expectedResult: 200 OK; trả về danh sách AuditLog khớp điều kiện (BR-19)
    - id: TC-SEC-008
      type: negative
      priority: Medium
      scenario: Tra cứu log theo action không tồn tại
      preconditions: Không có
      requestData: action=NON_EXISTENT_ACTION
      expectedResult: 200 OK; data=[], meta.totalItems=0
    - id: TC-SEC-009
      type: businessRule
      priority: High
      scenario: Người dùng không phải Admin cố truy cập Audit Log
      preconditions: Đăng nhập với role OPERATOR
      requestData: Không có tham số đặc biệt
      expectedResult: 403 Forbidden (BR-02, BR-19)
  totalTestCases: 9
- code: LOC
  file: fr13-locations.yaml
  name: 13. Locations (FR13)
  description: Vị trí tài xế, tìm tài xế gần, ETA (BR-05, BR-17)
  endpoints:
  - method: PUT
    path: /drivers/{driverId}/location
    fr: FR13.1
    description: Tài xế cập nhật vị trí
    allowedRole: Chính tài xế đó
    testCases:
    - id: TC-LOC-001
      type: positive
      priority: High
      scenario: Cập nhật vị trí GPS định kỳ khi đang Online
      preconditions: Tài xế đang AVAILABLE hoặc BUSY
      requestData: '{"location":{"latitude":10.7769,"longitude":106.7009},"heading":90}'
      expectedResult: 204 No Content; vị trí mới được lưu để phục vụ FR05 và ETA (BR-17)
    - id: TC-LOC-002
      type: negative
      priority: Medium
      scenario: Cập nhật vị trí thiếu tọa độ
      preconditions: Đã đăng nhập DRIVER
      requestData: '{"heading":90}'
      expectedResult: 400 Bad Request; field location bắt buộc
    - id: TC-LOC-003
      type: businessRule
      priority: High
      scenario: Tài xế khác cố cập nhật vị trí thay cho tài xế khác
      preconditions: Đăng nhập DRIVER A, driverId trong path là của DRIVER B
      requestData: '{"location":{"latitude":10.77,"longitude":106.70}}'
      expectedResult: 403 Forbidden (BR-02)
  - method: GET
    path: /drivers/{driverId}/location
    fr: '-'
    description: Xem vị trí hiện tại của tài xế
    allowedRole: Chính tài xế đó, Operator, khách hàng của chuyến đang chạy
    testCases:
    - id: TC-LOC-004
      type: positive
      priority: High
      scenario: Operator xem vị trí hiện tại của tài xế để giám sát
      preconditions: Tài xế đã cập nhật vị trí gần nhất
      requestData: driverId hợp lệ
      expectedResult: 200 OK; trả về Location mới nhất
    - id: TC-LOC-005
      type: negative
      priority: Medium
      scenario: Tài xế chưa từng gửi vị trí nào
      preconditions: Tài xế mới, chưa online lần nào
      requestData: driverId hợp lệ
      expectedResult: 404 Not Found; chưa có dữ liệu vị trí
    - id: TC-LOC-006
      type: businessRule
      priority: High
      scenario: driverId không tồn tại
      preconditions: Không có
      requestData: driverId không hợp lệ
      expectedResult: 404 Not Found
  - method: GET
    path: /drivers/nearby
    fr: FR13.2
    description: Tìm tài xế gần khách hàng
    allowedRole: Hệ thống / Operator
    testCases:
    - id: TC-LOC-007
      type: positive
      priority: High
      scenario: Tìm tài xế AVAILABLE trong bán kính 3km
      preconditions: Có tài xế AVAILABLE trong bán kính chỉ định
      requestData: latitude=10.7626&longitude=106.6602&radiusKm=3&vehicleTypeCode=CAB_4
      expectedResult: 200 OK; trả về danh sách NearbyDriver sắp xếp theo distanceKm tăng dần
    - id: TC-LOC-008
      type: negative
      priority: Medium
      scenario: Thiếu tham số latitude bắt buộc
      preconditions: Không có
      requestData: longitude=106.6602&radiusKm=3
      expectedResult: 400 Bad Request; field latitude bắt buộc
    - id: TC-LOC-009
      type: businessRule
      priority: High
      scenario: Dịch vụ bản đồ/GPS bên ngoài không khả dụng
      preconditions: Map & GPS Provider đang gặp sự cố
      requestData: latitude=10.7626&longitude=106.6602
      expectedResult: 503 Service Unavailable; không ảnh hưởng các chức năng khác của hệ thống (BR-20)
    - id: TC-LOC-010
      type: additional
      priority: Medium
      scenario: Không có tài xế phù hợp nào trong bán kính tìm kiếm
      preconditions: Toàn bộ tài xế trong khu vực đang BUSY hoặc OFFLINE
      requestData: latitude=10.7626&longitude=106.6602&radiusKm=3
      expectedResult: 200 OK; trả về mảng rỗng [] để hệ thống tiếp tục mở rộng bán kính hoặc báo NO_DRIVER
        (BR-08)
  - method: GET
    path: /eta
    fr: FR13.3
    description: Hỗ trợ dự kiến thời gian đến (ETA)
    allowedRole: Người dùng đã đăng nhập
    testCases:
    - id: TC-LOC-011
      type: positive
      priority: High
      scenario: Tính ETA giữa hai tọa độ hợp lệ
      preconditions: Map Provider hoạt động bình thường
      requestData: fromLat=10.7626&fromLng=106.6602&toLat=10.7769&toLng=106.7009
      expectedResult: 200 OK; trả về distanceKm, durationMinutes, source=MAP_PROVIDER
    - id: TC-LOC-012
      type: negative
      priority: Medium
      scenario: Thiếu tọa độ đích (toLat/toLng)
      preconditions: Không có
      requestData: fromLat=10.7626&fromLng=106.6602
      expectedResult: 400 Bad Request; field toLat, toLng bắt buộc
    - id: TC-LOC-013
      type: businessRule
      priority: High
      scenario: Map & GPS Provider không phản hồi
      preconditions: Dịch vụ bên ngoài đang gián đoạn
      requestData: fromLat=10.7626&fromLng=106.6602&toLat=10.7769&toLng=106.7009
      expectedResult: 503 Service Unavailable (BR-20)
  totalTestCases: 13
