      priority: Medium
      scenario: Xem cước khi chuyến chưa hoàn thành
      preconditions: Trip đang IN_PROGRESS, chưa có Fare
      requestData: tripId hợp lệ
      expectedResult: 404 Not Found; chưa có dữ liệu Fare cho chuyến này
    - id: TC-PAY-003
      type: businessRule
      priority: High
      scenario: Người dùng không liên quan xem cước chuyến
      preconditions: Đăng nhập bằng tài khoản không liên quan chuyến
      requestData: tripId của người khác
      expectedResult: 403 Forbidden (BR-02)
  - method: POST
    path: /trips/{tripId}/fare
    fr: FR07.1
    description: Tính cước sau khi hoàn thành chuyến
    allowedRole: Hệ thống / Operator
    testCases:
    - id: TC-PAY-004
      type: positive
      priority: High
      scenario: Tính cước ngay sau khi Trip chuyển COMPLETED
      preconditions: Trip vừa chuyển sang trạng thái COMPLETED
      requestData: tripId hợp lệ
      expectedResult: 201 Created; Fare.total được tính theo distanceKm và cấu hình cước (BR-11)
    - id: TC-PAY-005
      type: negative
      priority: Medium
      scenario: Tính cước khi chuyến chưa hoàn thành
      preconditions: Trip đang IN_PROGRESS
      requestData: tripId hợp lệ
      expectedResult: 409 Conflict; chỉ tính cước khi Trip.status=COMPLETED (BR-11)
    - id: TC-PAY-006
      type: businessRule
      priority: High
      scenario: Tính cước 2 lần cho cùng một chuyến
      preconditions: Fare đã được tính trước đó cho tripId
      requestData: tripId đã có Fare
      expectedResult: 409 Conflict; Fare đã tồn tại, không tính trùng
  - method: POST
    path: /payments
    fr: FR07.2
    description: Tạo giao dịch thanh toán
    allowedRole: Khách hàng của chuyến
    testCases:
    - id: TC-PAY-007
      type: positive
      priority: High
      scenario: Thanh toán tiền mặt thành công
      preconditions: Fare đã được tính cho tripId
      requestData: '{"tripId":"<tripId>","method":"CASH"}'
      expectedResult: 201 Created; Payment.status=SUCCESS (ghi nhận thanh toán tiền mặt)
    - id: TC-PAY-008
      type: negative
      priority: Medium
      scenario: Thanh toán điện tử thiếu providerToken
      preconditions: Fare đã tính, method=E_WALLET
      requestData: '{"tripId":"<tripId>","method":"E_WALLET"}'
      expectedResult: 400 Bad Request; providerToken bắt buộc khi method=E_WALLET
    - id: TC-PAY-009
      type: businessRule
      priority: High
      scenario: Thanh toán cho chuyến chưa có Fare
      preconditions: Trip chưa được tính cước
      requestData: '{"tripId":"<tripId>","method":"CASH"}'
