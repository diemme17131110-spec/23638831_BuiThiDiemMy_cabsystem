    - id: TC-PAY-010
      type: additional
      priority: Medium
      scenario: Payment Provider tạm thời không phản hồi
      preconditions: Fare đã tính, method=E_WALLET, dịch vụ Payment Provider đang down
      requestData: '{"tripId":"<tripId>","method":"E_WALLET","providerToken":"tok_123"}'
      expectedResult: 503 Service Unavailable; lỗi thanh toán không làm sập toàn bộ luồng đặt xe (BR-20)
  - method: GET
    path: /payments
    fr: '-'
    description: Tra cứu giao dịch thanh toán
    allowedRole: Operator, chính khách hàng liên quan
    testCases:
    - id: TC-PAY-011
      type: positive
      priority: High
      scenario: Tra cứu giao dịch theo tripId
      preconditions: Có Payment gắn với tripId
      requestData: tripId=<tripId>
      expectedResult: 200 OK; trả về danh sách Payment khớp tripId
    - id: TC-PAY-012
      type: negative
      priority: Medium
      scenario: Tra cứu theo status=FAILED
      preconditions: Có một số giao dịch FAILED
      requestData: status=FAILED
      expectedResult: 200 OK; chỉ trả về Payment có status=FAILED
    - id: TC-PAY-013
      type: businessRule
      priority: High
      scenario: Không có giao dịch nào khớp điều kiện lọc
      preconditions: Không có
      requestData: tripId=00000000-0000-0000-0000-000000000000
      expectedResult: 200 OK; data=[], meta.totalItems=0
  - method: GET
    path: /payments/{paymentId}
    fr: '-'
    description: Chi tiết giao dịch
    allowedRole: Operator, chính khách hàng liên quan
    testCases:
    - id: TC-PAY-014
      type: positive
      priority: High
      scenario: Xem chi tiết giao dịch thành công
      preconditions: paymentId tồn tại
      requestData: paymentId hợp lệ
      expectedResult: 200 OK; trả về Payment đầy đủ
    - id: TC-PAY-015
      type: negative
      priority: Medium
      scenario: paymentId không tồn tại
      preconditions: Không có
      requestData: paymentId không hợp lệ
      expectedResult: 404 Not Found
    - id: TC-PAY-016
      type: businessRule
      priority: High
      scenario: Khách hàng khác cố xem giao dịch không thuộc về mình
      preconditions: Đăng nhập tài khoản khác
      requestData: paymentId của người khác
      expectedResult: 403 Forbidden (BR-02)
  - method: POST
    path: /payments/{paymentId}/retry
    fr: FR07.4
    description: Thực hiện lại thanh toán thất bại
    allowedRole: Chính khách hàng liên quan
    testCases:
    - id: TC-PAY-017
      type: positive
      priority: High
      scenario: Thanh toán lại thành công sau lần thất bại đầu tiên
      preconditions: Payment trước đó ở trạng thái FAILED
      requestData: paymentId hợp lệ
      expectedResult: 200 OK; tạo giao dịch mới status=SUCCESS (BR-14)
    - id: TC-PAY-018
      type: negative
      priority: Medium
      scenario: Thử thanh toán lại cho giao dịch đã SUCCESS
      preconditions: Payment đã ở trạng thái SUCCESS
      requestData: paymentId đã thành công
      expectedResult: 409 Conflict; giao dịch đã thành công, không cần thử lại
    - id: TC-PAY-019
      type: businessRule
      priority: High
      scenario: Payment Provider tiếp tục lỗi khi thử lại
      preconditions: Payment FAILED, provider vẫn đang gặp sự cố
      requestData: paymentId hợp lệ
      expectedResult: 503 Service Unavailable; thông báo khách hàng thử lại sau (BR-20)
  - method: POST
    path: /payments/webhooks/provider
    fr: '-'
    description: Webhook kết quả thanh toán từ Payment Provider
    allowedRole: Payment Provider (chữ ký HMAC)
    testCases:
    - id: TC-PAY-020
      type: positive
      priority: High
      scenario: Nhận webhook SUCCESS hợp lệ từ provider
      preconditions: Có giao dịch PENDING chờ xác nhận, chữ ký hợp lệ
      requestData: '{"providerTransactionId":"PTX001","paymentId":"<paymentId>","status":"SUCCESS"}'
      expectedResult: 204 No Content; Payment cập nhật sang SUCCESS
    - id: TC-PAY-021
      type: negative
      priority: Medium
      scenario: Webhook thiếu chữ ký HMAC hợp lệ
      preconditions: Request không có header X-Provider-Signature đúng
      requestData: '{"providerTransactionId":"PTX002","paymentId":"<paymentId>","status":"FAILED"}'
      expectedResult: 401 Unauthorized; từ chối xử lý webhook không xác thực được nguồn gốc
    - id: TC-PAY-022
      type: businessRule
      priority: High
      scenario: Webhook báo trạng thái FAILED
      preconditions: Chữ ký hợp lệ
      requestData: '{"providerTransactionId":"PTX003","paymentId":"<paymentId>","status":"FAILED"}'
      expectedResult: 204 No Content; Payment cập nhật FAILED, hệ thống thông báo khách hàng (BR-14)
    - id: TC-PAY-023
      type: additional
      priority: Medium
      scenario: Webhook trả trạng thái không xác định (UNKNOWN)
      preconditions: Chữ ký hợp lệ, provider trả kết quả mập mờ
      requestData: '{"providerTransactionId":"PTX004","paymentId":"<paymentId>","status":"UNKNOWN"}'
      expectedResult: 204 No Content; Payment giữ trạng thái chờ đối soát thủ công (BR-29, quy trình cụ
        thể cần BA xác nhận)
  totalTestCases: 23
