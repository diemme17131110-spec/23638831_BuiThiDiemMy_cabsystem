# =====================================================================
# CAB System - API Test Cases (200 test case)
# Bam theo openapi.yaml da tao truoc do (13 file FR trong /paths)
# Moi endpoint >= 3 test case: positive / negative / businessRule
# 8 endpoint cot loi co them 1 test case 'additional'
# =====================================================================
project: 23638831_BuiThiDiemMy_cabsystem
title: CAB System - API Test Cases
sourceApi: openapi.yaml
standard: IEEE 829 / Agile Testing
totalEndpoints: 64
totalTestCases: 200
priorityLegend:
  High: Luồng chính (happy path) và các Business Rule bắt buộc
  Medium: Validation lỗi đầu vào và các edge case
modules:
- code: AUTH
  file: fr01-auth.yaml
  name: 1. Account & Auth (FR01)
  description: Đăng ký, đăng nhập, làm mới token, thông tin tài khoản (BR-01)
  endpoints:
  - method: POST
    path: /auth/register
    fr: FR01.1
    description: Đăng ký tài khoản
    allowedRole: Không cần đăng nhập
    testCases:
    - id: TC-AUTH-001
      type: positive
      priority: High
      scenario: Đăng ký tài khoản khách hàng thành công
      preconditions: Số điện thoại chưa tồn tại trong hệ thống
      requestData: '{"fullName":"Nguyễn Văn An","phone":"0912345678","password":"Passw0rd!","role":"CUSTOMER"}'
      expectedResult: 201 Created; trả về User với id, role=CUSTOMER, status=ACTIVE
    - id: TC-AUTH-002
      type: negative
      priority: Medium
      scenario: Đăng ký thiếu trường bắt buộc
      preconditions: Không có
      requestData: '{"phone":"0912345678"}'
      expectedResult: 400 Bad Request; code=VALIDATION_ERROR nêu rõ field fullName, password bắt buộc
    - id: TC-AUTH-003
      type: businessRule
      priority: High
      scenario: Đăng ký với số điện thoại đã tồn tại
      preconditions: Số điện thoại 0912345678 đã đăng ký trước đó
      requestData: '{"fullName":"Trần Văn Bình","phone":"0912345678","password":"Passw0rd!","role":"CUSTOMER"}'
      expectedResult: 409 Conflict; thông báo số điện thoại đã được sử dụng
  - method: POST
    path: /auth/login
    fr: FR01.2
    description: Đăng nhập
    allowedRole: Không cần đăng nhập
    testCases:
    - id: TC-AUTH-004
      type: positive
      priority: High
      scenario: Đăng nhập thành công với thông tin đúng
      preconditions: Tài khoản 0912345678 đang ACTIVE
      requestData: '{"phone":"0912345678","password":"Passw0rd!"}'
      expectedResult: 200 OK; trả về accessToken, refreshToken, expiresIn=3600 (BR-01)
    - id: TC-AUTH-005
      type: negative
      priority: Medium
      scenario: Đăng nhập với mật khẩu sai
      preconditions: Tài khoản 0912345678 đang ACTIVE
      requestData: '{"phone":"0912345678","password":"WrongPass"}'
      expectedResult: 401 Unauthorized; code=UNAUTHORIZED, không cấp token
    - id: TC-AUTH-006
      type: businessRule
      priority: High
      scenario: Đăng nhập bằng tài khoản đã bị khóa
      preconditions: Tài khoản 0900000001 ở trạng thái LOCKED
      requestData: '{"phone":"0900000001","password":"Passw0rd!"}'
      expectedResult: 401 Unauthorized; thông báo tài khoản bị khóa
    - id: TC-AUTH-007
      type: additional
      priority: Medium
      scenario: 'Chống brute-force: khóa tạm sau nhiều lần đăng nhập sai liên tiếp'
      preconditions: Tài khoản hợp lệ, đã nhập sai mật khẩu 5 lần liên tiếp trong 5 phút
      requestData: '{"phone":"0912345678","password":"WrongPass6"}'
      expectedResult: 401 Unauthorized kèm code=ACCOUNT_TEMP_LOCKED (BR-18, ngưỡng cụ thể cần BA xác nhận)
  - method: POST
    path: /auth/refresh
    fr: '-'
    description: Làm mới access token
    allowedRole: Sở hữu refreshToken hợp lệ
    testCases:
    - id: TC-AUTH-008
      type: positive
      priority: High
      scenario: Làm mới token thành công với refreshToken hợp lệ
      preconditions: refreshToken còn hiệu lực
      requestData: '{"refreshToken":"<valid_refresh_token>"}'
      expectedResult: 200 OK; trả về TokenPair mới
    - id: TC-AUTH-009
      type: negative
      priority: Medium
      scenario: Làm mới token thiếu refreshToken
      preconditions: Không có
      requestData: '{}'
      expectedResult: 400 Bad Request; field refreshToken bắt buộc
    - id: TC-AUTH-010
      type: businessRule
      priority: High
      scenario: Làm mới token với refreshToken đã hết hạn/bị thu hồi
      preconditions: refreshToken đã hết hạn
      requestData: '{"refreshToken":"<expired_refresh_token>"}'
      expectedResult: 401 Unauthorized; yêu cầu đăng nhập lại
  - method: POST
    path: /auth/logout
    fr: '-'
    description: Đăng xuất
    allowedRole: Đã đăng nhập (Bearer token)
    testCases:
    - id: TC-AUTH-011
      type: positive
      priority: High
      scenario: Đăng xuất thành công
      preconditions: Người dùng đang đăng nhập với accessToken hợp lệ
      requestData: 'Header: Authorization: Bearer <valid_token>'
      expectedResult: 204 No Content; token bị vô hiệu hóa cho các request sau
    - id: TC-AUTH-012
      type: negative
      priority: Medium
      scenario: Đăng xuất khi không có token
      preconditions: Không gửi header Authorization
      requestData: Không có Authorization header
      expectedResult: 401 Unauthorized
    - id: TC-AUTH-013
      type: businessRule
      priority: High
      scenario: Gọi lại API cần xác thực bằng token vừa đăng xuất
      preconditions: Token vừa được đăng xuất ở bước trước
      requestData: 'Header: Authorization: Bearer <revoked_token>'
      expectedResult: 401 Unauthorized (BR-01) tại các endpoint yêu cầu xác thực
  - method: GET
    path: /auth/me
    fr: FR01.4
    description: Xem thông tin tài khoản hiện tại
    allowedRole: Đã đăng nhập
    testCases:
    - id: TC-AUTH-014
      type: positive
      priority: High
      scenario: Lấy thông tin tài khoản đang đăng nhập
      preconditions: accessToken hợp lệ
      requestData: 'Header: Authorization: Bearer <valid_token>'
      expectedResult: 200 OK; trả về User đầy đủ fullName, phone, role, status
    - id: TC-AUTH-015
      type: negative
      priority: Medium
      scenario: Truy cập khi token đã hết hạn
      preconditions: accessToken đã hết hạn
      requestData: 'Header: Authorization: Bearer <expired_token>'
      expectedResult: 401 Unauthorized; ứng dụng điều hướng về màn hình đăng nhập
    - id: TC-AUTH-016
      type: businessRule
      priority: High
      scenario: Password/hash không bao giờ xuất hiện trong response
      preconditions: accessToken hợp lệ
      requestData: 'Header: Authorization: Bearer <valid_token>'
      expectedResult: 200 OK; payload JSON không chứa trường password/passwordHash
  - method: PATCH
    path: /auth/me
    fr: FR01.3
    description: Cập nhật thông tin tài khoản
    allowedRole: Đã đăng nhập
    testCases:
    - id: TC-AUTH-017
      type: positive
      priority: High
      scenario: Cập nhật họ tên và email thành công
      preconditions: Đã đăng nhập
      requestData: '{"fullName":"Nguyễn Văn An Bình","email":"anbinh@example.com"}'
      expectedResult: 200 OK; User trả về với dữ liệu đã cập nhật
    - id: TC-AUTH-018
      type: negative
      priority: Medium
      scenario: Cập nhật với email sai định dạng
      preconditions: Đã đăng nhập
      requestData: '{"email":"an.nguyen_invalid"}'
      expectedResult: 400 Bad Request; code=VALIDATION_ERROR field email
    - id: TC-AUTH-019
      type: businessRule
      priority: High
      scenario: Cập nhật thông tin của tài khoản khác
      preconditions: Đăng nhập bằng tài khoản A, cố gắng gửi request nhắm tới userId của tài khoản B
      requestData: '{"fullName":"Hacker"}'
      expectedResult: 403 Forbidden; chỉ được sửa hồ sơ của chính mình (BR-02)
  totalTestCases: 19
- code: CUST
  file: fr02-customers.yaml
  name: 2. Customers (FR02)
  description: Hồ sơ khách hàng và lịch sử chuyến đi (BR-01)
  endpoints:
  - method: GET
    path: /customers/{customerId}
    fr: FR02.1
    description: Xem hồ sơ khách hàng
    allowedRole: Chính khách hàng đó, Operator hoặc Admin
    testCases:
    - id: TC-CUST-001
      type: positive
      priority: High
      scenario: Khách hàng xem hồ sơ của chính mình
      preconditions: Đã đăng nhập với role CUSTOMER
      requestData: customerId = id của chính khách hàng
      expectedResult: 200 OK; trả về Customer gồm totalTrips
    - id: TC-CUST-002
      type: negative
      priority: Medium
      scenario: Xem hồ sơ với customerId không tồn tại
      preconditions: Đã đăng nhập
      requestData: customerId = 00000000-0000-0000-0000-000000000000
      expectedResult: 404 Not Found
    - id: TC-CUST-003
      type: businessRule
      priority: High
      scenario: Khách hàng A cố xem hồ sơ khách hàng B
      preconditions: Đăng nhập bằng tài khoản A (CUSTOMER)
      requestData: customerId = id của khách hàng B
      expectedResult: 403 Forbidden (BR-02)
  - method: PATCH
    path: /customers/{customerId}
    fr: FR02.1
    description: Cập nhật hồ sơ khách hàng
    allowedRole: Chính khách hàng đó hoặc Operator
    testCases:
    - id: TC-CUST-004
      type: positive
      priority: High
      scenario: Cập nhật hồ sơ khách hàng thành công
      preconditions: Đã đăng nhập với role CUSTOMER
      requestData: '{"fullName":"Nguyễn Văn An Cập Nhật"}'
      expectedResult: 200 OK; trả về Customer đã cập nhật
    - id: TC-CUST-005
      type: negative
      priority: Medium
      scenario: Gửi payload rỗng
      preconditions: Đã đăng nhập
      requestData: '{}'
      expectedResult: 200 OK; không thay đổi dữ liệu (không có field nào được gửi)
    - id: TC-CUST-006
      type: businessRule
      priority: High
      scenario: Operations Staff cập nhật hồ sơ khách hàng thay mặt
      preconditions: Đăng nhập với role OPERATOR
      requestData: '{"fullName":"Đã hỗ trợ sửa tên"}'
      expectedResult: 200 OK; thao tác được phép theo phân quyền Operator (BR-02)
  - method: GET
    path: /customers/{customerId}/trips
    fr: FR02.2
    description: Lịch sử chuyến đi và số tiền phải trả
    allowedRole: Chính khách hàng đó, Operator hoặc Admin
    testCases:
    - id: TC-CUST-007
      type: positive
      priority: High
      scenario: Xem lịch sử chuyến đi có phân trang
      preconditions: Khách hàng đã có 25 chuyến đi
      requestData: page=1&size=20
      expectedResult: 200 OK; data gồm 20 Trip, meta.totalItems=25, totalPages=2
    - id: TC-CUST-008
      type: negative
      priority: Medium
      scenario: Lọc lịch sử theo khoảng thời gian
      preconditions: Khách hàng có chuyến trong và ngoài khoảng lọc
      requestData: from=2026-09-01T00:00:00Z&to=2026-09-30T23:59:59Z
      expectedResult: 200 OK; chỉ trả về các Trip có createdAt trong khoảng from/to
    - id: TC-CUST-009
      type: businessRule
      priority: High
      scenario: Khách hàng chưa từng đặt chuyến nào
      preconditions: Tài khoản mới, chưa có Trip
      requestData: page=1&size=20
      expectedResult: 200 OK; data=[] , meta.totalItems=0
  totalTestCases: 9
- code: DRV
  file: fr03-drivers.yaml
  name: 3. Drivers & Vehicles (FR03)
  description: Hồ sơ tài xế, phương tiện, trạng thái sẵn sàng (BR-02, BR-03)
  endpoints:
  - method: GET
    path: /drivers
    fr: FR03.1
    description: Danh sách tài xế
    allowedRole: Operator, Admin
    testCases:
    - id: TC-DRV-001
      type: positive
      priority: High
      scenario: Operator lấy danh sách tài xế đang AVAILABLE
      preconditions: Có tài xế ở nhiều trạng thái khác nhau
      requestData: status=AVAILABLE&page=1&size=20
      expectedResult: 200 OK; chỉ trả về Driver có status=AVAILABLE
    - id: TC-DRV-002
      type: negative
      priority: Medium
      scenario: Truyền status không hợp lệ
      preconditions: Đã đăng nhập với role OPERATOR
      requestData: status=INVALID_STATUS
      expectedResult: 400 Bad Request; giá trị status không thuộc enum DriverStatus
    - id: TC-DRV-003
      type: businessRule
      priority: High
      scenario: Khách hàng (CUSTOMER) cố truy cập danh sách tài xế nội bộ
      preconditions: Đăng nhập với role CUSTOMER
      requestData: 'Header: Authorization: Bearer <customer_token>'
      expectedResult: 403 Forbidden (BR-02)
  - method: POST
    path: /drivers
    fr: FR03.1
    description: Tạo hồ sơ tài xế
    allowedRole: Operator, Admin
    testCases:
    - id: TC-DRV-004
      type: positive
      priority: High
      scenario: Tạo hồ sơ tài xế mới thành công
      preconditions: Số GPLX chưa tồn tại trong hệ thống
      requestData: '{"fullName":"Lê Văn Cường","phone":"0933112233","licenseNumber":"B2-7901234567"}'
      expectedResult: 201 Created; Driver mới ở trạng thái mặc định OFFLINE
    - id: TC-DRV-005
      type: negative
      priority: Medium
      scenario: Tạo hồ sơ thiếu số GPLX
      preconditions: Không có
      requestData: '{"fullName":"Lê Văn Cường","phone":"0933112233"}'
      expectedResult: 400 Bad Request; field licenseNumber bắt buộc
    - id: TC-DRV-006
      type: businessRule
      priority: High
      scenario: Tạo hồ sơ với số GPLX đã tồn tại
      preconditions: licenseNumber B2-7901234567 đã được đăng ký cho tài xế khác
      requestData: '{"fullName":"Nguyễn Văn D","phone":"0933112244","licenseNumber":"B2-7901234567"}'
      expectedResult: 409 Conflict; số GPLX đã được đăng ký
  - method: GET
    path: /drivers/{driverId}
    fr: FR03.1
    description: Xem hồ sơ tài xế
    allowedRole: Chính tài xế đó, Operator, Admin
    testCases:
    - id: TC-DRV-007
      type: positive
      priority: High
      scenario: Xem hồ sơ tài xế thành công
      preconditions: driverId tồn tại
      requestData: driverId hợp lệ
      expectedResult: 200 OK; trả về Driver gồm averageRating, activeVehicle
    - id: TC-DRV-008
      type: negative
      priority: Medium
      scenario: driverId không tồn tại
      preconditions: Không có
      requestData: driverId=00000000-0000-0000-0000-000000000000
      expectedResult: 404 Not Found
    - id: TC-DRV-009
      type: businessRule
      priority: High
      scenario: Tài xế A xem hồ sơ tài xế B
      preconditions: Đăng nhập với role DRIVER (tài xế A)
      requestData: driverId = id của tài xế B
      expectedResult: 403 Forbidden (BR-02)
  - method: PATCH
    path: /drivers/{driverId}
    fr: FR03.1
    description: Cập nhật hồ sơ tài xế
    allowedRole: Chính tài xế đó hoặc Operator
    testCases:
    - id: TC-DRV-010
      type: positive
      priority: High
      scenario: Tài xế tự cập nhật họ tên
      preconditions: Đăng nhập với role DRIVER
      requestData: '{"fullName":"Lê Văn Cường Mới"}'
      expectedResult: 200 OK; Driver trả về với fullName đã cập nhật
    - id: TC-DRV-011
      type: negative
      priority: Medium
      scenario: Cập nhật với dữ liệu rỗng không hợp lệ
      preconditions: Đăng nhập với role DRIVER
      requestData: '{"fullName":""}'
      expectedResult: 400 Bad Request; fullName không được để trống
    - id: TC-DRV-012
      type: businessRule
      priority: High
      scenario: Khách hàng cố cập nhật hồ sơ tài xế
      preconditions: Đăng nhập với role CUSTOMER
      requestData: '{"fullName":"Hacked"}'
      expectedResult: 403 Forbidden (BR-02)
  - method: PUT
    path: /drivers/{driverId}/availability
    fr: FR03.3
    description: Cập nhật trạng thái sẵn sàng
    allowedRole: Chính tài xế đó
    testCases:
    - id: TC-DRV-013
      type: positive
      priority: High
      scenario: Tài xế chuyển trạng thái sang AVAILABLE thành công
      preconditions: Tài xế đã đăng nhập, phương tiện đã được duyệt, GPS đang bật
      requestData: '{"status":"AVAILABLE"}'
      expectedResult: 200 OK; Driver.status=AVAILABLE (BR-03); xuất hiện trong danh sách phân công
    - id: TC-DRV-014
      type: negative
      priority: Medium
      scenario: Chuyển sang trạng thái không hợp lệ
      preconditions: Đăng nhập với role DRIVER
      requestData: '{"status":"UNKNOWN"}'
      expectedResult: 400 Bad Request; giá trị status không thuộc enum
    - id: TC-DRV-015
      type: businessRule
      priority: High
      scenario: Chuyển sang OFFLINE khi đang có chuyến BUSY dở dang
      preconditions: Tài xế đang ở trạng thái BUSY với 1 chuyến IN_PROGRESS
      requestData: '{"status":"OFFLINE"}'
      expectedResult: 409 Conflict; không cho phép offline khi đang có chuyến dở dang
  - method: GET
    path: /drivers/{driverId}/vehicles
    fr: FR03.2
    description: Danh sách phương tiện của tài xế
    allowedRole: Chính tài xế đó, Operator
    testCases:
    - id: TC-DRV-016
      type: positive
      priority: High
      scenario: Lấy danh sách phương tiện của tài xế
      preconditions: Tài xế có 1 phương tiện đã đăng ký
      requestData: driverId hợp lệ
      expectedResult: 200 OK; trả về mảng Vehicle
    - id: TC-DRV-017
      type: negative
      priority: Medium
      scenario: driverId không tồn tại
      preconditions: Không có
      requestData: driverId không hợp lệ
      expectedResult: 404 Not Found
    - id: TC-DRV-018
      type: businessRule
      priority: High
      scenario: Tài xế chưa có phương tiện nào
      preconditions: Tài xế mới đăng ký, chưa thêm phương tiện
      requestData: driverId hợp lệ
      expectedResult: 200 OK; trả về mảng rỗng []
  - method: POST
    path: /drivers/{driverId}/vehicles
    fr: FR03.2
    description: Thêm phương tiện
    allowedRole: Chính tài xế đó hoặc Operator
    testCases:
    - id: TC-DRV-019
      type: positive
      priority: High
      scenario: Thêm phương tiện mới thành công
      preconditions: Biển số chưa tồn tại trong hệ thống
      requestData: '{"plateNumber":"51H-987.65","brand":"Toyota","model":"Vios","color":"Trắng","vehicleTypeCode":"CAB_4"}'
      expectedResult: 201 Created; Vehicle mới ở trạng thái chờ duyệt
    - id: TC-DRV-020
      type: negative
      priority: Medium
      scenario: Thêm phương tiện thiếu biển số
      preconditions: Không có
      requestData: '{"brand":"Toyota","vehicleTypeCode":"CAB_4"}'
      expectedResult: 400 Bad Request; field plateNumber bắt buộc
    - id: TC-DRV-021
      type: businessRule
      priority: High
      scenario: Thêm phương tiện với biển số đã tồn tại
      preconditions: Biển số 51H-987.65 đã đăng ký cho tài xế khác
      requestData: '{"plateNumber":"51H-987.65","vehicleTypeCode":"CAB_4"}'
      expectedResult: 409 Conflict; biển số xe đã được đăng ký
  - method: GET
    path: /vehicles/{vehicleId}
    fr: FR03.2
    description: Chi tiết phương tiện
    allowedRole: Chủ xe, Operator
    testCases:
    - id: TC-DRV-022
      type: positive
      priority: High
      scenario: Xem chi tiết phương tiện thành công
      preconditions: vehicleId tồn tại
      requestData: vehicleId hợp lệ
      expectedResult: 200 OK; trả về Vehicle đầy đủ thông tin
    - id: TC-DRV-023
      type: negative
      priority: Medium
      scenario: vehicleId không tồn tại
      preconditions: Không có
      requestData: vehicleId không hợp lệ
      expectedResult: 404 Not Found
    - id: TC-DRV-024
      type: businessRule
      priority: High
      scenario: Tài xế khác cố xem phương tiện không thuộc sở hữu
      preconditions: Đăng nhập với role DRIVER không sở hữu xe này
      requestData: vehicleId của tài xế khác
      expectedResult: 403 Forbidden (BR-02)
  - method: PATCH
    path: /vehicles/{vehicleId}
    fr: FR03.2
    description: Cập nhật phương tiện
    allowedRole: Chủ xe, Operator
    testCases:
    - id: TC-DRV-025
      type: positive
      priority: High
      scenario: Cập nhật màu sắc phương tiện thành công
      preconditions: vehicleId thuộc sở hữu người dùng hiện tại
      requestData: '{"color":"Xanh dương"}'
      expectedResult: 200 OK; Vehicle trả về với color đã cập nhật
