- code: MATCH
  file: fr05-matching.yaml
  name: 5. Driver Matching (FR05)
  description: Tìm, phân công, nhận/từ chối chuyến (BR-03 đến BR-08)
  endpoints:
  - method: GET
    path: /bookings/{bookingId}/matching
    fr: FR05.1
    description: Trạng thái tiến trình tìm tài xế
    allowedRole: Chính khách hàng đó, Operator
    testCases:
    - id: TC-MATCH-001
      type: positive
      priority: High
      scenario: Xem trạng thái đang tìm tài xế
      preconditions: Booking vừa được tạo, đang SEARCHING
      requestData: bookingId hợp lệ
      expectedResult: 200 OK; MatchingState.status=SEARCHING, attemptCount tăng dần
    - id: TC-MATCH-002
      type: negative
      priority: Medium
      scenario: Xem trạng thái khi đã tìm được tài xế
      preconditions: Đã có tài xế ACCEPTED offer
      requestData: bookingId hợp lệ
      expectedResult: 200 OK; status=ASSIGNED, currentOfferId=null
    - id: TC-MATCH-003
      type: businessRule
      priority: High
      scenario: bookingId không tồn tại
      preconditions: Không có
      requestData: bookingId không hợp lệ
      expectedResult: 404 Not Found
  - method: POST
    path: /bookings/{bookingId}/matching
    fr: FR05.2
    description: Kích hoạt lại tìm tài xế
    allowedRole: Hệ thống / Operator
    testCases:
    - id: TC-MATCH-004
      type: positive
      priority: High
      scenario: Kích hoạt lại tìm tài xế sau khi bị từ chối
      preconditions: Offer trước đó bị REJECTED
      requestData: bookingId hợp lệ
      expectedResult: 202 Accepted; MatchingState.status=SEARCHING, attemptCount+1 (BR-06)
    - id: TC-MATCH-005
      type: negative
      priority: Medium
      scenario: Kích hoạt khi booking đã ASSIGNED
      preconditions: Booking đã có tài xế nhận
      requestData: bookingId hợp lệ
      expectedResult: 409 Conflict; không thể tìm lại khi đã phân công
    - id: TC-MATCH-006
      type: businessRule
      priority: High
      scenario: Hết danh sách tài xế phù hợp sau nhiều lần thử
      preconditions: Đã thử tối đa số lần cho phép, không còn tài xế phù hợp
      requestData: bookingId hợp lệ
      expectedResult: 200 OK; MatchingState.status=NO_DRIVER, thông báo khách hàng (BR-08)
  - method: GET
    path: /bookings/{bookingId}/matching/attempts
    fr: '-'
    description: Lịch sử các lần gửi yêu cầu cho tài xế
    allowedRole: Operator
    testCases:
    - id: TC-MATCH-007
      type: positive
      priority: High
      scenario: Xem lịch sử các lần thử phân công
      preconditions: Booking đã trải qua 3 lần thử (2 từ chối, 1 chấp nhận)
      requestData: bookingId hợp lệ
      expectedResult: 200 OK; trả về 3 MatchingAttempt với result tương ứng
    - id: TC-MATCH-008
      type: negative
      priority: Medium
      scenario: Booking chưa có lần thử nào
      preconditions: Booking vừa tạo, chưa gửi offer nào
      requestData: bookingId hợp lệ
      expectedResult: 200 OK; trả về mảng rỗng []
    - id: TC-MATCH-009
      type: businessRule
      priority: High
      scenario: Khách hàng (không phải Operator) cố xem lịch sử
      preconditions: Đăng nhập với role CUSTOMER
      requestData: bookingId hợp lệ
      expectedResult: 403 Forbidden (BR-02)
  - method: GET
    path: /driver-offers/{offerId}
    fr: FR05.3
    description: Chi tiết yêu cầu chuyến gửi cho tài xế
    allowedRole: Chính tài xế được mời
    testCases:
    - id: TC-MATCH-010
      type: positive
      priority: High
      scenario: Tài xế xem chi tiết offer gửi tới mình
      preconditions: Offer đang ở trạng thái PENDING
      requestData: offerId hợp lệ
      expectedResult: 200 OK; trả về DriverOffer gồm estimatedFare, expiresAt
    - id: TC-MATCH-011
      type: negative
      priority: Medium
      scenario: offerId không tồn tại
      preconditions: Không có
      requestData: offerId không hợp lệ
      expectedResult: 404 Not Found
    - id: TC-MATCH-012
      type: businessRule
      priority: High
      scenario: Tài xế khác (không được mời) cố xem offer
      preconditions: Đăng nhập DRIVER không thuộc offer này
      requestData: offerId của tài xế khác
      expectedResult: 403 Forbidden (BR-02)
  - method: POST
    path: /driver-offers/{offerId}/accept
    fr: '-'
    description: Tài xế nhận chuyến
    allowedRole: Chính tài xế được mời
    testCases:
    - id: TC-MATCH-013
      type: positive
      priority: High
      scenario: Tài xế chấp nhận chuyến trong thời hạn cho phép
      preconditions: Offer đang PENDING, chưa hết hạn expiresAt
      requestData: offerId hợp lệ
      expectedResult: 200 OK; tạo Trip mới status=ASSIGNED, thông báo khách hàng
    - id: TC-MATCH-014
      type: negative
      priority: Medium
      scenario: Chấp nhận offer đã hết hạn
      preconditions: Thời điểm hiện tại > expiresAt của offer
      requestData: offerId đã hết hạn
      expectedResult: 409 Conflict; offer đã hết hạn, không thể nhận
    - id: TC-MATCH-015
      type: businessRule
      priority: High
      scenario: Chấp nhận offer đã được tài xế khác nhận trước (race condition)
      preconditions: Offer vừa được một tài xế khác accept thành công
      requestData: offerId đã bị nhận
      expectedResult: 409 Conflict; offer đã được xử lý, không thể nhận lại
    - id: TC-MATCH-016
      type: additional
      priority: Medium
      scenario: Hai tài xế cùng bấm nhận đồng thời cho một offer
      preconditions: Hai request accept gửi gần như cùng lúc cho cùng offerId
      requestData: offerId hợp lệ (gửi đồng thời bởi 2 tài xế)
      expectedResult: Chỉ 1 request nhận 200 OK; request còn lại nhận 409 Conflict (đảm bảo tính nhất
        quán dữ liệu)
  - method: POST
    path: /driver-offers/{offerId}/reject
    fr: FR05.5
    description: Tài xế từ chối chuyến
    allowedRole: Chính tài xế được mời
    testCases:
    - id: TC-MATCH-017
      type: positive
      priority: High
      scenario: Tài xế từ chối chuyến hợp lệ
      preconditions: Offer đang PENDING
      requestData: '{"reason":"Quá xa điểm đón"}'
      expectedResult: 200 OK; MatchingState chuyển sang tìm tài xế tiếp theo (BR-06)
    - id: TC-MATCH-018
      type: negative
      priority: Medium
      scenario: Từ chối một offer đã hết hạn
      preconditions: Offer đã EXPIRED
      requestData: '{"reason":"Không kịp"}'
      expectedResult: 409 Conflict; offer không còn ở trạng thái PENDING
    - id: TC-MATCH-019
      type: businessRule
      priority: High
      scenario: Tài xế không phản hồi trong thời gian quy định
      preconditions: Offer PENDING quá thời gian timeout mà không có accept/reject
      requestData: Không có hành động nào từ tài xế
      expectedResult: Hệ thống tự chuyển offer sang EXPIRED và tìm tài xế khác (BR-07, thời gian cụ thể
        cần BA xác nhận)
  totalTestCases: 19
